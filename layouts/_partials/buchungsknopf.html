{{- /* Buchungsknopf oder – solange kein Link eingetragen ist – ein Hinweis.
     Aufruf: partial "buchungsknopf.html" "beratung"  (oder "kurs") */ -}}
{{- $link := index site.Params.buchung . }}
{{- if $link }}
<a class="button" href="{{ $link }}" rel="noopener">{{ i18n (printf "buchen_%s" .) }}</a>
{{- else }}
<p class="hinweis">{{ i18n "buchen_bald" }}</p>
{{- end }}
